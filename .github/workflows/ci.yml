name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # New advisories and a newer stable Rust show up without a commit.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Main's runs all finish, so each of its commits has a result and the cache it saves.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        if: matrix.arch == 'x64'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Mapping, roster, device identity, the driver request layouts and a real pipe round trip.
      # The HidHide test is ignored here: it needs the driver.
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --workspace --locked
      # The runner has the Visual C++ Redistributable, so a program that needs it would still start
      # here: its import table is checked instead.
      - name: No Visual C++ runtime needed
        shell: pwsh
        run: |
          foreach ($exe in 'open-controller.exe', 'open-controller-ui.exe') {
            if (Select-String -Path "target\debug\$exe" -Pattern 'vcruntime140' -SimpleMatch -Quiet) { throw "$exe needs VCRUNTIME140.dll" }
          }

      # The runner has neither ViGEmBus nor HidHide: the engine must still start, report them
      # missing and exit 0, and the window must open and draw.
      - name: Smoke test, resident process
        shell: pwsh
        run: |
          $p = Start-Process target\debug\open-controller.exe -ArgumentList '--smoke','--data-dir',"$env:RUNNER_TEMP\smoke" -PassThru -Wait -NoNewWindow
          exit $p.ExitCode
      - name: Smoke test, window
        shell: pwsh
        run: |
          $p = Start-Process target\debug\open-controller-ui.exe -ArgumentList '--smoke' -PassThru -Wait -NoNewWindow
          exit $p.ExitCode
      - name: Smoke log
        if: always()
        shell: bash
        run: cat "$RUNNER_TEMP/smoke/smoke.log" 2>/dev/null || echo "no smoke log"
      # The installer: a new install, an update over it, and an uninstall that removes it.
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc /Qp /DVersion=0.0.0 /DBuild=target\debug /DArch=${{ matrix.arch }} packaging\windows\open-controller.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Only the installer is waited for: Start-Process -Wait would also wait for the app it starts.
      - name: Install, update and uninstall
        shell: pwsh
        timeout-minutes: 10
        run: |
          $setup = (Get-ChildItem dist\*-setup.exe | Select-Object -First 1).FullName
          $app = "$env:LOCALAPPDATA\Programs\open-controller"
          (Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru).WaitForExit()
          if (-not (Test-Path "$app\open-controller.exe")) { throw "the installer did not install" }
          (Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru).WaitForExit()
          if (-not (Test-Path "$app\unins000.exe")) { throw "the update lost the uninstaller" }
          (Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -PassThru).WaitForExit()
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path "$app\open-controller.exe") -and (Get-Date) -lt $deadline) { Start-Sleep 1 }
          if (Test-Path "$app\open-controller.exe") { throw "the uninstaller left the program behind" }
          if (Get-Process open-controller* -ErrorAction SilentlyContinue) { throw "the uninstaller left the program running" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.arch }}-setup
          path: dist/*-setup.exe

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype6-dev libvulkan-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Includes the uinput request numbers, the udev rule and a real Unix socket round trip.
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --workspace --bins --examples --locked
      - name: Smoke test, resident process
        run: target/debug/open-controller --smoke --data-dir "$RUNNER_TEMP/smoke"
      # The runner's kernel has uinput: the whole path, from SDL's virtual controller to the
      # kernel's event node and the rumble back, is checked as root.
      - name: Loopback through uinput
        run: |
          sudo modprobe uinput
          sudo target/debug/examples/linux_loopback
      # Every archive ships THIRD_PARTY_NOTICES.md: it must list what the builds link now.
      - name: Third-party notices
        if: matrix.arch == 'x64'
        run: |
          python3 scripts/third_party_notices.py
          git diff --exit-code THIRD_PARTY_NOTICES.md

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --workspace --locked
      - name: Smoke test, resident process
        run: target/debug/open-controller --smoke --data-dir "$RUNNER_TEMP/smoke"

  # The oldest Rust the workspace says it builds with (rust-version in Cargo.toml).
  msrv:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype6-dev libvulkan-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Named on the command line: rust-toolchain.toml would pick stable over the default.
      - name: Check
        run: cargo +1.97 check --workspace --all-targets --locked

  # Known vulnerabilities, unmaintained crates, licenses and where crates come from (deny.toml).
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses sources

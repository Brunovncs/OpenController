name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Mapping, roster, device identity, the driver request layouts and a real pipe round trip.
      # The HidHide test is ignored here: it needs the driver.
      - name: Tests
        run: cargo test --workspace
      - name: Build
        run: cargo build --workspace

      # The runner has neither ViGEmBus nor HidHide: the engine must still start, report them
      # missing and exit 0, and the window must open and draw.
      - name: Smoke test, resident process
        shell: pwsh
        run: |
          $p = Start-Process target\debug\open-controller.exe -ArgumentList '--smoke','--data-dir',"$env:RUNNER_TEMP\smoke" -PassThru -Wait -NoNewWindow
          exit $p.ExitCode
      - name: Smoke test, window
        shell: pwsh
        run: |
          $p = Start-Process target\debug\open-controller-ui.exe -ArgumentList '--smoke' -PassThru -Wait -NoNewWindow
          exit $p.ExitCode
      - name: Smoke log
        if: always()
        shell: bash
        run: cat "$RUNNER_TEMP/smoke/smoke.log" 2>/dev/null || echo "no smoke log"

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype6-dev libvulkan-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Includes the uinput request numbers, the udev rule and a real Unix socket round trip.
      - name: Tests
        run: cargo test --workspace
      - name: Build
        run: cargo build --workspace --bins --examples
      - name: Smoke test, resident process
        run: target/debug/open-controller --smoke --data-dir "$RUNNER_TEMP/smoke"
      # The runner's kernel has uinput: the whole path, from SDL's virtual controller to the
      # kernel's event node and the rumble back, is checked as root.
      - name: Loopback through uinput
        run: |
          sudo modprobe uinput
          sudo target/debug/examples/linux_loopback

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Build
        run: cargo build --workspace
      - name: Smoke test, resident process
        run: target/debug/open-controller --smoke --data-dir "$RUNNER_TEMP/smoke"

name: release

# Push a tag like v0.1.0 (matching the version in Cargo.toml) to build a Windows zip into a
# draft GitHub release. The executables are not code-signed, so SmartScreen warns on first launch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --workspace

      - name: Package
        shell: pwsh
        run: |
          $name = "open-controller-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory "dist\$name" | Out-Null
          Copy-Item target\release\open-controller.exe, target\release\open-controller-ui.exe, README.md, LICENSE "dist\$name"
          Compress-Archive -Path "dist\$name" -DestinationPath "dist\$name.zip"

      - name: Upload to a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --draft --title "Open Controller ${{ github.ref_name }}" --notes ""
          gh release upload "${{ github.ref_name }}" dist/*.zip --clobber

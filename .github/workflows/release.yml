name: Release

# Push a tag like v0.2.0, matching the version in Cargo.toml, to build the Windows zip, the Linux
# tarball and the macOS apps, and publish them as a release whose notes are that version's
# section of CHANGELOG.md. Nothing is signed by a vendor: SmartScreen warns on first launch, and
# macOS asks to open the app with a right-click the first time.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag against Cargo.toml and CHANGELOG.md
        id: check
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"; exit 1; }
          grep -qx "## $version" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace
      - name: Build
        run: cargo build --release --workspace
      - name: Package
        shell: pwsh
        run: |
          $name = "open-controller-${{ needs.version.outputs.version }}-windows-x64"
          New-Item -ItemType Directory "dist\$name" | Out-Null
          Copy-Item target\release\open-controller.exe, target\release\open-controller-ui.exe, README.md, LICENSE, THIRD_PARTY_NOTICES.md, CHANGELOG.md "dist\$name"
          Compress-Archive -Path "dist\$name" -DestinationPath "dist\$name.zip"
          (Get-FileHash "dist\$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "dist\$name.zip.sha256"
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc /Qp /DVersion=${{ needs.version.outputs.version }} /DBuild=target\release packaging\windows\open-controller.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = "open-controller-${{ needs.version.outputs.version }}-windows-x64-setup.exe"
          (Get-FileHash "dist\$setup" -Algorithm SHA256).Hash.ToLower() + "  $setup" | Out-File -Encoding ascii "dist\$setup.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip*
            dist/*-setup.exe*

  linux:
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype6-dev libvulkan-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace
      - name: Build
        run: cargo build --release --workspace
      - name: Package
        run: sh packaging/package.sh linux "${{ needs.version.outputs.version }}" target/release
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz*

  # One universal app for Apple silicon and Intel. Signed with the certificate in the
  # MACOS_CERT_P12 secret (base64 of a .p12, its password in MACOS_CERT_PASSWORD) when there is
  # one, so the Accessibility permission survives updates; ad hoc otherwise.
  macos:
    needs: version
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace
      - name: Build
        run: |
          cargo build --release --workspace --target aarch64-apple-darwin
          cargo build --release --workspace --target x86_64-apple-darwin
          mkdir -p target/universal/release
          for bin in open-controller open-controller-ui; do
            lipo -create -output "target/universal/release/$bin" \
              "target/aarch64-apple-darwin/release/$bin" "target/x86_64-apple-darwin/release/$bin"
          done
      - name: Signing certificate
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          [ -n "$CERT" ] || { echo "MACOS_CERT_P12 is not set; the app is signed ad hoc"; exit 0; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # A self-signed certificate is not trusted, so it is looked up without -v, by its hash.
          identity=$(security find-identity -p codesigning "$keychain" | awk '/^ *1\)/ { print $2; exit }')
          [ -n "$identity" ] || { echo "No code signing identity in MACOS_CERT_P12"; exit 1; }
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Package
        run: sh packaging/package.sh macos "${{ needs.version.outputs.version }}" target/universal/release universal
      - name: Remove the signing keychain
        if: always()
        run: '[ -z "${KEYCHAIN:-}" ] || security delete-keychain "$KEYCHAIN"'
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip*

  publish:
    needs: [version, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        run: |
          awk -v v="## ${{ needs.version.outputs.version }}" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "OpenController ${{ needs.version.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
      # The site caches the latest release for an hour; this makes it link the new one at once.
      # Skipped until SITE_REVALIDATE_SECRET is set (the same value as REVALIDATE_SECRET on Vercel).
      - name: Refresh the website
        env:
          SECRET: ${{ secrets.SITE_REVALIDATE_SECRET }}
        run: |
          [ -n "$SECRET" ] || { echo "SITE_REVALIDATE_SECRET is not set; the site updates within two hours"; exit 0; }
          curl -fsS --location-trusted -X POST -H "Authorization: Bearer $SECRET" https://opencontroller.com.br/api/revalidate

name: Release

# Push a tag like v0.2.0, matching the version in Cargo.toml, to build the Windows zips and
# installers and the Linux tarballs (x64 and ARM64 each) and the macOS app (universal), and
# publish them as a release whose notes are that version's section of CHANGELOG.md. Nothing is
# signed by a vendor: SmartScreen warns on first launch, and macOS blocks the first start until
# the user allows it in System Settings, Privacy & Security. Run by hand, it is a rehearsal: every
# package is built and kept with the run, and nothing is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Only the job that publishes may write: the builds run hundreds of crates' build scripts.
permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against Cargo.toml and CHANGELOG.md
        id: check
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$GITHUB_REF_TYPE" != tag ] || [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"; exit 1; }
          [ "$GITHUB_REF_TYPE" != tag ] || grep -qx "## $version" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Each architecture built natively on its own runner. A tag's cache is never used again, so
  # none is saved here: it would only push main's out.
  windows:
    needs: version
    strategy:
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.arch }}
          save-if: false
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --workspace --locked
      # The release build compiles the window's shaders ahead of time, which the debug build in
      # CI never does: both programs are started once as they ship.
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process target\release\open-controller.exe -ArgumentList '--smoke','--data-dir',"$env:RUNNER_TEMP\smoke" -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          $p = Start-Process target\release\open-controller-ui.exe -ArgumentList '--smoke' -PassThru -Wait -NoNewWindow
          exit $p.ExitCode
      - name: Package
        shell: pwsh
        run: |
          $name = "open-controller-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory "dist\$name" | Out-Null
          Copy-Item target\release\open-controller.exe, target\release\open-controller-ui.exe, README.md, LICENSE, THIRD_PARTY_NOTICES.md, CHANGELOG.md "dist\$name"
          Compress-Archive -Path "dist\$name" -DestinationPath "dist\$name.zip"
          (Get-FileHash "dist\$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "dist\$name.zip.sha256"
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc /Qp /DVersion=${{ needs.version.outputs.version }} /DBuild=target\release /DArch=${{ matrix.arch }} packaging\windows\open-controller.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = "open-controller-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-setup.exe"
          (Get-FileHash "dist\$setup" -Algorithm SHA256).Hash.ToLower() + "  $setup" | Out-File -Encoding ascii "dist\$setup.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*.zip*
            dist/*-setup.exe*

  # 22.04 on both, so the binaries need no newer glibc than 2.35 (Raspberry Pi OS Bookworm has
  # 2.36). Built natively: packaging runs the new binary for the udev rule.
  linux:
    needs: version
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype6-dev libvulkan-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.arch }}
          save-if: false
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --workspace --locked
      - name: Package
        run: sh packaging/package.sh linux "${{ needs.version.outputs.version }}" target/release ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz*

  # One app for both kinds of Mac: each architecture built, then joined with lipo.
  macos:
    needs: version
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build
        run: |
          cargo build --release --workspace --locked --target aarch64-apple-darwin
          cargo build --release --workspace --locked --target x86_64-apple-darwin
          mkdir -p target/universal/release
          for bin in open-controller open-controller-ui; do
            lipo -create -output "target/universal/release/$bin" \
              "target/aarch64-apple-darwin/release/$bin" "target/x86_64-apple-darwin/release/$bin"
          done
      - name: Signing certificate
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          [ -n "$CERT" ] || { echo "MACOS_CERT_P12 is not set; the app is signed ad hoc"; exit 0; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # A self-signed certificate is not trusted, so it is looked up without -v, by its hash.
          identity=$(security find-identity -p codesigning "$keychain" | awk '/^ *1\)/ { print $2; exit }')
          [ -n "$identity" ] || { echo "No code signing identity in MACOS_CERT_P12"; exit 1; }
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Package
        run: sh packaging/package.sh macos "${{ needs.version.outputs.version }}" target/universal/release universal
      - name: Remove the signing keychain
        if: always()
        run: '[ -z "${KEYCHAIN:-}" ] || security delete-keychain "$KEYCHAIN"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/*.zip*

  publish:
    needs: [version, windows, linux, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        run: |
          awk -v v="## ${{ needs.version.outputs.version }}" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "OpenController ${{ needs.version.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
      # The site caches the latest release for an hour; this makes it link the new one at once.
      # Skipped until SITE_REVALIDATE_SECRET is set (the same value as REVALIDATE_SECRET on Vercel).
      - name: Refresh the website
        env:
          SECRET: ${{ secrets.SITE_REVALIDATE_SECRET }}
        run: |
          [ -n "$SECRET" ] || { echo "SITE_REVALIDATE_SECRET is not set; the site updates within two hours"; exit 0; }
          curl -fsS --location-trusted -X POST -H "Authorization: Bearer $SECRET" https://opencontroller.com.br/api/revalidate

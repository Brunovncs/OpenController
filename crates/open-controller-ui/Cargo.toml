[package]
name = "open-controller-ui"
description = "OpenController's window, a separate process that exists only while it is open"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "open-controller-ui"
path = "src/main.rs"

[dependencies]
open-controller-core.workspace = true
# GPUI is published by the gpui-kit maintainers as `gpui-pre-*` snapshots of Zed; the crate
# names inside are still `gpui` and `gpui_platform`. Pinned exactly: its API moves with Zed.
gpui = { package = "gpui-pre", version = "=0.3.7" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["font-kit", "wayland", "x11"] }
async-channel = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"

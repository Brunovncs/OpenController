[package]
name = "open-controller"
description = "OpenController's resident process: the engine, and on Windows the notification-area icon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "open-controller"
path = "src/main.rs"

[dependencies]
open-controller-core.workspace = true
crossbeam-channel.workspace = true
dirs = "6"
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# The login item, registered with the system from inside the app bundle.
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

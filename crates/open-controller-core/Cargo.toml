[package]
name = "open-controller-core"
description = "Open Controller's core: controller input, virtual Xbox 360 controllers, device hiding and the tray/window protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
# SDL 3 is built from source and linked statically, with only the subsystems a gamepad needs:
# joystick (and its HIDAPI drivers), haptics for rumble, sensors and power for battery.
sdl3-sys = { version = "0.7.2", default-features = false, features = [
    "build-from-source-static",
    "no-default-subsystems",
    "sdl-joystick",
    "sdl-hidapi",
    "sdl-haptic",
    "sdl-sensor",
    "sdl-power",
] }

[target.'cfg(windows)'.dependencies]
# Checks a downloaded driver installer against the hash it had when this version was made.
sha2 = "0.10"
windows-sys = { workspace = true, features = [
    "Win32_Devices_Bluetooth",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Shell",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading", "Win32_UI_Input_XboxController"] }
